<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCE Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>MCE Options</h1>
    <button id="production-mode-btn">Production Mode</button>
    <button id="pg-mode-btn">PG mode</button>
    <br />
    <input id="motd-input" type="text" placeholder="Enter your MOTD" />
    <button id="save-motd-btn">Save MOTD</button>
    <div id="notificatioans-options-container">
      <input type="number" min="1" max="60" value="30" id="notifications-interval-input" />
      <label>
        <input type="checkbox" id="enable-notifications-checkbox" />
        Enable Notifications
      </label>
      <button id="save-notifications-options">Save Notifications Options</button>
    </div>
  </body>
  <script src="options.js"></script>
</html>
