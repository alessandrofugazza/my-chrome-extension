<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Chrome Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>My Chrome Extension</h1>
    <section>
      <label>
        <input type="checkbox" id="in-progress-checkbox" />
        In progress
      </label>
    </section>
    <section>
      <h2>Notes</h2>
      <button id="annotate-page-btn">New Note</button>
      <div id="page-notes-container"></div>
    </section>
    <section>
      <h2>Notes [dev]</h2>
      <div id="d-btn-container">
        <button id="d-annotate-page-btn">Add Task</button>
      </div>
      <div id="d-page-notes-container"></div>
    </section>
  </body>
  <script src="popup.js"></script>
</html>
